server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes have no file on disk — serve the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Résumé PDF and portrait are static and versioned by hand
    location /cv/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Vite fingerprints every asset filename, so they can be cached forever
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or clients pin to a dead build
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The three.js bundle is ~1.2 MB raw / ~326 kB gzipped — gzip is not optional
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
